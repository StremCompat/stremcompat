// The Android apps, side by side with their own IDs: for TVs web (the pages in a WebView) and native
// (LG-C over SDL2), and for phones the phone interface (service/mobile) in a WebView; all above
// ExoPlayer and with the local server on an embedded Node.
// scripts/package-android.js stages what the app carries into ../../.build/android-tv-app:
//   assets/service  the local server and the pages, as for LG (build-stage.js, profile android-tv)
//   jniLibs/<abi>   libnode.so (nodejs-mobile) and the FFmpeg, FFprobe and torrent programs
//   node            nodejs-mobile's headers, for the small native part that starts Node
plugins {
    id 'com.android.application'
}

def staged = new File(rootDir, '../.build/android-tv-app').canonicalFile
/* the native app's code (LG-C), next to this repository; its assets are staged by LG-C/build.sh android */
def lgc = new File(rootDir, '../../../LG-C').canonicalFile
def profile = new groovy.json.JsonSlurper().parse(new File(rootDir, '../profiles/android-tv.json'))
/* the native app follows the native version (5.x), as on LG and Samsung */
def nativeVersion = new groovy.json.JsonSlurper().parse(new File(rootDir, '../profiles/lg-native.json')).version
def versionCodeOf = { String s -> def v = s.tokenize('.').collect { it as int }; v[0] * 10000 + v[1] * 100 + v[2] }
def signing = new Properties()
def signingFile = file(System.getenv('STREMCOMPAT_SIGNING') ?: "${System.getProperty('user.home')}/Android/stremcompat-signing.properties")
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'io.github.alexesmm.stremcompat'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId profile.appId
        minSdk 24
        targetSdk 35
        versionName profile.version
        versionCode versionCodeOf(profile.version)
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments "-DNODE_DIR=${staged}/node", '-DANDROID_STL=c++_shared' }
        }
    }

    /* each app runs its own server, on its own port; the native one takes over the web one's
       data on its first start (handover, server/app-runtime.js) */
    flavorDimensions 'ui'
    productFlavors {
        web {
            dimension 'ui'
            buildConfigField 'int', 'SERVER_PORT', "${profile.port}"
            buildConfigField 'int', 'HANDOVER_PORT', '0'
            resValue 'string', 'app_name', 'StremCompat'
        }
        'native' {
            dimension 'ui'
            applicationIdSuffix '.native'
            versionName nativeVersion
            versionCode versionCodeOf(nativeVersion)
            buildConfigField 'int', 'SERVER_PORT', "${profile.port + 1}"
            buildConfigField 'int', 'HANDOVER_PORT', "${profile.port}"
            resValue 'string', 'app_name', 'StremCompat Native (Beta)'
            externalNativeBuild {
                cmake { arguments "-DLGC_DIR=${lgc.path.replace(File.separator, '/')}", "-DAPP_VERSION=${nativeVersion}", "-DSC_PORT=${profile.port + 1}" }
            }
        }
        phone {
            dimension 'ui'
            applicationIdSuffix '.phone'
            buildConfigField 'int', 'SERVER_PORT', "${profile.port + 2}"
            buildConfigField 'int', 'HANDOVER_PORT', '0'
            resValue 'string', 'app_name', 'StremCompat'
        }
    }

    signingConfigs {
        release {
            if (signing.storeFile) {
                storeFile file(signing.storeFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signing.storeFile) signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    sourceSets {
        main {
            assets.srcDirs = ["${staged}/assets"]
            jniLibs.srcDirs = ["${staged}/jniLibs"]
        }
        'native' {
            assets.srcDirs += "${lgc}/build/android"
            java.srcDirs += "${lgc}/third_party/sdl-src/SDL2-2.30.9/android-project/app/src/main/java"
        }
    }
    /* the programs are run from the folder the libraries are unpacked to */
    packagingOptions { jniLibs { useLegacyPackaging true } }
}

dependencies {
    def media3 = '1.5.1'
    implementation "androidx.media3:media3-exoplayer:${media3}"
    implementation "androidx.media3:media3-exoplayer-hls:${media3}"
    /* the phone's player screen has ExoPlayer's touch controls */
    phoneImplementation "androidx.media3:media3-ui:${media3}"
}
