name: Build and release profiles

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: The tag names the profiles' version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          foreach ($name in 'lg-armv7-1080', 'lg-armv7') {
            $version = (Get-Content "profiles/$name.json" -Raw | ConvertFrom-Json).version
            if ("v$version" -ne '${{ github.ref_name }}') { throw "profiles/$name.json is $version, the tag is ${{ github.ref_name }}" }
          }
      - run: npm run runtime
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run package:all
      - run: node scripts/make-homebrew-repo.js dist/StremCompat-${{ github.ref_name }}-1080p.ipk homebrew-repo https://stremcompat.github.io/webos lg-armv7-1080
        if: startsWith(github.ref, 'refs/tags/')
      - run: node scripts/make-homebrew-repo.js dist/StremCompat-${{ github.ref_name }}-720p.ipk homebrew-repo/720 https://stremcompat.github.io/webos/720 lg-armv7
        if: startsWith(github.ref, 'refs/tags/')
      - uses: actions/upload-artifact@v4
        with:
          name: webos-ipks
          path: dist/*.ipk
      # the Homebrew repositories live on StremCompat/webos (gh-pages) and the old address's repository;
      # the folder is handed over to be copied there
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: homebrew-repo
          path: homebrew-repo
      - name: Publish tag assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: StremCompat for LG webOS ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*.ipk

